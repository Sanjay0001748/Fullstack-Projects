<h1 style="display: flex; justify-content: center;align-items: center;">Todo List</h1>
<div class="body">

    <div>
        <form action="">
            <input [(ngModel)]="taskList.title" type="text" name="title" placeholder="enter task title" />
            <div></div>
            <input [(ngModel)]="taskList.description" type="text" name="description" placeholder="enter description" />
            <div></div>
            <button type="submit" (click)="addTask()">Add Task</button>
        </form>
    </div>
    <div class="taskList">
        <h1>Task Lists</h1>
        <div *ngFor="let task of tasksCollection ">
            <p style="font-weight: bold;font-size: 18px;">{{task.description}}</p>
        </div>
    </div>
</div>
